{% extends 'base.html' %}{% block content %}<h1>Final assessment results</h1><div class="table-responsive"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Score</th><th>Status</th><th>Date</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.user_id}}</td><td>{{r.course_id}}</td><td>{{r.percentage}}%</td><td>{{'Passed' if r.passed else 'Failed'}}</td><td>{{r.created_at.strftime('%d %b %Y')}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
