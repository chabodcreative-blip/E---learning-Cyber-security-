{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Manage courses</h1><a class="btn btn-outline-secondary" href="{{url_for('auth.admin_dashboard')}}">Admin dashboard</a></div><div class="table-responsive mt-4"><table class="table"><thead><tr><th>Course</th><th>Modules</th><th>Action</th></tr></thead><tbody>{% for c in courses %}<tr><td>{{c.title}}</td><td>{{c.modules|length}}</td><td><form method="post" action="{{url_for('auth.admin_delete_course',course_id=c.id)}}" onsubmit="return confirm('Delete this course and its lessons?')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
