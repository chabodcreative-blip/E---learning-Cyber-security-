{% extends 'base.html' %}{% block content %}<div class="mb-4"><div class="eyebrow">Final assessment</div><h1>{{course.title}}</h1><p class="muted">Pass threshold: 70%. Questions cover material taught across the course.</p></div><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for q in questions %}<div class="lesson-panel p-4 mb-3"><strong>{{loop.index}}. {{q.question}}</strong>{% for opt in q.options|fromjson %}<label class="choice d-block"><input type="radio" name="q_{{q.id}}" value="{{loop.index0}}" required> {{opt}}</label>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Submit final assessment</button></form>{% endblock %}
